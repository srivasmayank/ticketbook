version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketbook_db
    ports:
      - "5433:5432"
    volumes:
      - ticketbook_pgdata:/var/lib/postgresql/data

volumes:
  ticketbook_pgdata:
